spring:
  datasource:
    url: jdbc:h2:mem:asset_management_worker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      password: ""
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

app:
  mqtt-worker:
    enabled: false
    reconcile-interval: 30s
    max-concurrent-connections: 2
