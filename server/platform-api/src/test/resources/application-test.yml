spring:
  datasource:
    url: jdbc:h2:mem:asset_management;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      password: ""
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

app:
  license:
    dir: ./target/license
  ops:
    backup-dir: ./target/ops-backups
    docker-enabled: false
    worker-health-url: http://127.0.0.1:9/actuator/health
    mqtt-host: 127.0.0.1
  secrets:
    active-key-version: test-v1
    active-key-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  security:
    # Generated by Spring for each test context; this is not a committed key.
    access-token:
      secret: ${random.uuid}${random.uuid}
    refresh-token:
      secure: false
    browser:
      allowed-origins: http://localhost
