bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Authentication is injected by docker-compose via --requirepass. Never place a
# password in this tracked file.

dir /data
appendonly yes
appendfsync everysec
save 3600 1
save 300 100
save 60 10000

# Evicting event/session keys silently is unsafe for this local baseline.
maxmemory-policy noeviction

# Avoid accidental destructive operations from routine application accounts.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
