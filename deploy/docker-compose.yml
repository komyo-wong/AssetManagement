name: asset-management-app

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  api:
    image: asset-management-api:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        APP_VERSION: ${APP_IMAGE_TAG:-1.0.7}

    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MQTT_WORKER_ENABLED: "false"
      APP_DOCUMENTS_ROOT: /app/data/documents
      OPS_BACKUP_DIR: /app/data/backups
      LICENSE_DIR: /app/data/backups/license
      OPS_DOCKER_ENABLED: "true"
      OPS_WORKER_HEALTH_URL: http://worker:8081/actuator/health
      OPS_MQTT_HOST: ${MQTT_PUBLIC_BROKER_HOST:-mosquitto}
      OPS_MQTT_PORT: "1883"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-asset_management}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MQTT_CONNECTION_TEST_ALLOWED_PRIVATE_ADDRESSES: ${MQTT_CONNECTION_TEST_ALLOWED_PRIVATE_ADDRESSES:-127.0.0.1,mosquitto}
      APP_DEV_BOOTSTRAP_MQTT_ENABLED: "true"
      APP_DEV_BOOTSTRAP_MQTT_BROKER_URI: ${APP_DEV_BOOTSTRAP_MQTT_BROKER_URI:-mqtt://mosquitto:1883}
      APP_DEV_BOOTSTRAP_MQTT_USERNAME: ${MQTT_USERNAME}
      APP_DEV_BOOTSTRAP_MQTT_PASSWORD: ${MQTT_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8080}:8080"
    volumes:
      - api_documents:/app/data/documents
      - api_backups:/app/data/backups
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *default-logging
    networks:
      - asset_backend
      - asset_frontend

  worker:
    image: asset-management-worker:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        APP_VERSION: ${APP_IMAGE_TAG:-1.0.7}

    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKER_MANAGEMENT_PORT: "8081"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MQTT_WORKER_ENABLED: "true"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-asset_management}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${WORKER_BIND_ADDRESS:-127.0.0.1}:${WORKER_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    networks:
      - asset_backend

  web:
    image: asset-management-web:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.web

    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    networks:
      - asset_frontend

volumes:
  api_documents:
  api_backups:

networks:
  asset_backend:
    external: true
    name: asset-management-backend
  asset_frontend:
    name: asset-management-frontend
    driver: bridge
